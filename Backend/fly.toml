# fly.toml - ClarityMeet Bot Server
app = "claritymeet-backend"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  SUPABASE_URL = "https://vyaiuwazgxjceoqtxtvv.supabase.co"
  DATA_DIR = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 10
    soft_limit = 5

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

# Persistent volume - keeps the Chromium profile and recordings across deploys
# so reCAPTCHA trust score and cookies accumulate over time.
[[mounts]]
  source = "claritymeet_data"
  destination = "/data"
  initial_size = "1gb"
