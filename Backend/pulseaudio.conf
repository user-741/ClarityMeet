# PulseAudio default config for ClarityMeet container
# Minimal setup: just enough for Chrome to output audio and ffmpeg to capture it

# Load the null sink module (virtual audio device)
load-module module-null-sink sink_name=ClarityMeet sink_properties=device.description="ClarityMeet"

# Make it the default sink so Chrome routes audio here automatically
set-default-sink ClarityMeet

# Native protocol (needed for pactl commands from Node.js child_process)
load-module module-native-protocol-unix

# Allow all local connections (no auth needed inside container)
load-module module-native-protocol-tcp auth-anonymous=1
